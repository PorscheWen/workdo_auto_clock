name: Workdo 自動打卡

on:
  # 定時執行（使用 UTC 時間）
  schedule:
    # 上班打卡：台灣 07:30-10:30 每 15 分鐘觸發（提高 Actions 延遲時的命中率）
    - cron: '30 23 * * 0-4'   # 07:30 TW（週一～五）
    - cron: '45 23 * * 0-4'   # 07:45 TW
    - cron: '0 0 * * 1-5'     # 08:00 TW
    - cron: '15 0 * * 1-5'    # 08:15 TW
    - cron: '30 0 * * 1-5'    # 08:30 TW
    - cron: '45 0 * * 1-5'    # 08:45 TW
    - cron: '0 1 * * 1-5'     # 09:00 TW
    - cron: '15 1 * * 1-5'    # 09:15 TW
    - cron: '30 1 * * 1-5'    # 09:30 TW
    - cron: '45 1 * * 1-5'    # 09:45 TW
    - cron: '0 2 * * 1-5'     # 10:00 TW
    - cron: '15 2 * * 1-5'    # 10:15 TW
    - cron: '30 2 * * 1-5'    # 10:30 TW
    # 下班打卡：台灣 15:00-18:30 每 15 分鐘觸發
    - cron: '0 7 * * 1-5'     # 15:00 TW
    - cron: '15 7 * * 1-5'    # 15:15 TW
    - cron: '30 7 * * 1-5'    # 15:30 TW
    - cron: '45 7 * * 1-5'    # 15:45 TW
    - cron: '0 8 * * 1-5'     # 16:00 TW
    - cron: '15 8 * * 1-5'    # 16:15 TW
    - cron: '30 8 * * 1-5'    # 16:30 TW
    - cron: '45 8 * * 1-5'    # 16:45 TW
    - cron: '0 9 * * 1-5'     # 17:00 TW
    - cron: '15 9 * * 1-5'    # 17:15 TW
    - cron: '30 9 * * 1-5'    # 17:30 TW
    - cron: '45 9 * * 1-5'    # 17:45 TW
    - cron: '0 10 * * 1-5'    # 18:00 TW
    - cron: '15 10 * * 1-5'   # 18:15 TW
    - cron: '30 10 * * 1-5'   # 18:30 TW

  # 允許手動觸發
  workflow_dispatch:
    inputs:
      action:
        description: '執行動作'
        required: true
        default: 'auto'
        type: choice
        options:
          - in
          - out
          - status
          - check-missing
          - auto
          - update-holidays

env:
  WORKDO_EMAIL: ${{ secrets.WORKDO_EMAIL }}
  WORKDO_PASSWORD: ${{ secrets.WORKDO_PASSWORD }}
  WORKDO_GPS_LOCATION: ${{ secrets.WORKDO_GPS_LOCATION }}
  WORKDO_GPS_PLACE: ${{ secrets.WORKDO_GPS_PLACE }}
  WORKDO_USE_LEAVE_API: ${{ secrets.WORKDO_USE_LEAVE_API }}
  LEAVE_DAYS_JSON: ${{ secrets.LEAVE_DAYS_JSON }}

jobs:
  # 依台灣時間判斷排程應執行上班或下班（不受 cron 延遲影響）
  setup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      run_clock_in: ${{ steps.check.outputs.run_clock_in }}
      run_clock_out: ${{ steps.check.outputs.run_clock_out }}
    steps:
      - name: 判斷排程動作
        id: check
        run: |
          TW_HOUR=$(TZ=Asia/Taipei date +%H)
          TW_MIN=$(TZ=Asia/Taipei date +%M)
          TW_TIME=$((10#$TW_HOUR * 100 + 10#$TW_MIN))
          echo "排程觸發 (${{ github.event.schedule }})，台灣時間 ${TW_HOUR}:${TW_MIN}" >&2
          if [ "$TW_TIME" -ge 730 ] && [ "$TW_TIME" -le 1030 ]; then
            echo "run_clock_in=true" >> $GITHUB_OUTPUT
            echo "run_clock_out=false" >> $GITHUB_OUTPUT
          elif [ "$TW_TIME" -ge 1500 ] && [ "$TW_TIME" -le 1830 ]; then
            echo "run_clock_in=false" >> $GITHUB_OUTPUT
            echo "run_clock_out=true" >> $GITHUB_OUTPUT
          else
            echo "run_clock_in=false" >> $GITHUB_OUTPUT
            echo "run_clock_out=false" >> $GITHUB_OUTPUT
          fi

  clock-in:
    needs: setup
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'in') ||
        (needs.setup.result == 'success' && needs.setup.outputs.run_clock_in == 'true')
      )
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 建立請假日設定檔
        if: env.LEAVE_DAYS_JSON != ''
        run: printf '%s\n' "$LEAVE_DAYS_JSON" > leave_days.json

      - name: 驗證 LEAVE_DAYS_JSON 可解析
        if: env.LEAVE_DAYS_JSON != ''
        run: python -c "import json; json.load(open('leave_days.json')); print('LEAVE_DAYS_JSON 格式正確')"

      - name: 合併台灣國定假日至 leave_days.json（與 Secret 並用）
        run: python workdo_auto_clock.py update-holidays-tw

      - name: 使用 Workdo 假期資料更新 leave_days.json（對齊 update-holidays.yml）
        if: env.WORKDO_USE_LEAVE_API == 'true'
        run: python workdo_auto_clock.py update-holidays

      - name: 執行上班打卡
        run: python workdo_auto_clock.py in

      - name: 上傳日誌
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workdo-log-clock-in-${{ github.run_number }}
          path: '*.log'
          retention-days: 7

  clock-out:
    needs: setup
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'out') ||
        (needs.setup.result == 'success' && needs.setup.outputs.run_clock_out == 'true')
      )
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 建立請假日設定檔
        if: env.LEAVE_DAYS_JSON != ''
        run: printf '%s\n' "$LEAVE_DAYS_JSON" > leave_days.json

      - name: 驗證 LEAVE_DAYS_JSON 可解析
        if: env.LEAVE_DAYS_JSON != ''
        run: python -c "import json; json.load(open('leave_days.json')); print('LEAVE_DAYS_JSON 格式正確')"

      - name: 合併台灣國定假日至 leave_days.json（與 Secret 並用）
        run: python workdo_auto_clock.py update-holidays-tw

      - name: 使用 Workdo 假期資料更新 leave_days.json（對齊 update-holidays.yml）
        if: env.WORKDO_USE_LEAVE_API == 'true'
        run: python workdo_auto_clock.py update-holidays

      - name: 執行下班打卡
        run: python workdo_auto_clock.py out

      - name: 上傳日誌
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workdo-log-clock-out-${{ github.run_number }}
          path: '*.log'
          retention-days: 7

  other-actions:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'in' && github.event.inputs.action != 'out'
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 建立請假日設定檔
        if: env.LEAVE_DAYS_JSON != ''
        run: printf '%s\n' "$LEAVE_DAYS_JSON" > leave_days.json

      - name: 驗證 LEAVE_DAYS_JSON 可解析
        if: env.LEAVE_DAYS_JSON != ''
        run: python -c "import json; json.load(open('leave_days.json')); print('LEAVE_DAYS_JSON 格式正確')"

      - name: 合併台灣國定假日至 leave_days.json（與 Secret 並用）
        run: python workdo_auto_clock.py update-holidays-tw

      - name: 使用 Workdo 假期資料更新 leave_days.json（對齊 update-holidays.yml）
        if: env.WORKDO_USE_LEAVE_API == 'true'
        run: python workdo_auto_clock.py update-holidays

      - name: 執行指定動作
        run: python workdo_auto_clock.py ${{ github.event.inputs.action }}

      - name: 上傳日誌
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workdo-log-${{ github.event.inputs.action }}-${{ github.run_number }}
          path: '*.log'
          retention-days: 7
